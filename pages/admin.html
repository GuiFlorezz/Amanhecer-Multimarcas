<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Amanhecer Multimarcas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS Geral da Loja -->
    <link rel="stylesheet" href="../style.css">

    <!-- ESTILOS EXCLUSIVOS DO PAINEL ADMIN -->
    <style>
        .admin-main {
            padding: 120px 20px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-title {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 30px;
            text-align: center;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }
        @media (min-width: 992px) {
            .admin-grid { grid-template-columns: 1fr 1fr; }
        }

        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .admin-card h3 {
            margin-bottom: 25px;
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .form-group input:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-gray);
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        /* Upload de Imagens */
        .file-upload-box {
            border: 2px dashed var(--border);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
            transition: 0.3s;
        }
        .file-upload-box:hover { border-color: var(--gold); }
        .file-upload-box input[type="file"] { display: none; }
        
        /* Grid de Fotos Drag and Drop */
        .image-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        .img-card-preview {
            position: relative;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            height: 85px;
            cursor: grab;
            user-select: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .img-card-preview:active {
            cursor: grabbing;
        }
        .img-card-preview.dragging {
            opacity: 0.4;
            border: 2px dashed var(--gold);
        }
        .img-card-preview.is-capa {
            border: 2px solid var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }
        .img-card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Garante que o arrasto funcione de forma uniforme */
        }
        .capa-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: var(--gold);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            z-index: 2;
        }

        /* Overlay do Botão de Exclusão (Surgiu com Duplo Clique) */
        .delete-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: fadeIn 0.15s ease-in-out;
        }
        .btn-delete-x {
            width: 42px;
            height: 42px;
            background: #ff4a4a;
            color: #fff;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 74, 74, 0.7);
            transition: transform 0.2s;
        }
        .btn-delete-x:hover {
            transform: scale(1.15);
        }

        /* Lista do Estoque */
        .car-list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .car-list-item img {
            width: 80px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
        }
        .car-info-list { flex: 1; }
        .car-info-list h4 { font-size: 1rem; margin-bottom: 4px; }
        .car-info-list p { font-size: 0.8rem; color: var(--gold); }
        .car-actions { display: flex; gap: 8px; }
        .btn-action {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-edit { background: rgba(212, 175, 55, 0.2); color: var(--gold); }
        .btn-edit:hover { background: var(--gold); color: #000; }
        .btn-delete { background: rgba(255, 74, 74, 0.1); color: #ff4a4a; }
        .btn-delete:hover { background: #ff4a4a; color: #fff; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 12px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-close {
            background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-darker">

    <header id="header">
        <div class="container navbar">
            <a href="../index.html" class="logo">Amanhecer<span>.</span></a>
            <nav id="nav-menu">
                <ul class="nav-links">
                    <li><a href="../index.html#estoque">Estoque</a></li>
                    <li><a href="login.html">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <h1 class="admin-title">Painel Administrativo</h1>
        
        <div class="admin-grid">
            
            <!-- CADASTRAR VEÍCULO -->
            <div class="admin-card">
                <h3>Cadastrar Novo Veículo</h3>
                <form id="form-add-car">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Nome do Veículo (Marca e Modelo)</label>
                            <input type="text" id="car-name" placeholder="Ex: Porsche 911 Carrera S" required>
                        </div>

                        <div class="form-group">
                            <label>Condição</label>
                            <select id="car-condition">
                                <option value="Novo">Novo (0 km)</option>
                                <option value="Seminovo">Seminovo</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Quilometragem</label>
                            <input type="text" id="car-km" placeholder="0 km" required>
                        </div>

                        <div class="form-group">
                            <label>Ano / Modelo</label>
                            <input type="text" id="car-year" placeholder="Ex: 2024 ou 2023/2024" maxlength="9" required>
                        </div>

                        <div class="form-group">
                            <label>Preço</label>
                            <input type="text" id="car-price" placeholder="R$ 0,00" required>
                        </div>

                        <div class="form-group">
                            <label>Câmbio</label>
                            <select id="car-gear">
                                <option value="Automático">Automático</option>
                                <option value="Manual">Manual</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Combustível</label>
                            <select id="car-fuel">
                                <option value="Flex">Flex</option>
                                <option value="Gasolina">Gasolina</option>
                                <option value="Elétrico">Elétrico</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Híbrido">Híbrido</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>Opcionais (Separe por vírgula)</label>
                            <input type="text" id="car-options" placeholder="Ex: Teto Solar, Bancos em Couro, Câmera 360º">
                        </div>

                        <div class="form-group full-width">
                            <label>Descrição do Veículo</label>
                            <textarea id="car-desc" rows="4" placeholder="Detalhes sobre o estado do carro..."></textarea>
                        </div>

                        <div class="form-group full-width">
                            <label>Fotos (Arraste para ordenar. Duplo clique para excluir foto)</label>
                            <div class="file-upload-box" onclick="document.getElementById('car-images').click()">
                                <span>+ Clique para Selecionar Fotos</span>
                                <input type="file" id="car-images" multiple accept="image/*" onchange="handleFileSelect(event, 'add')">
                            </div>
                            <div class="image-preview-container" id="preview-container"></div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 20px;">CADASTRAR VEÍCULO</button>
                </form>
            </div>

            <!-- ESTOQUE ATUAL -->
            <div class="admin-card">
                <h3>Veículos no Site</h3>
                <div id="inventory-list"></div>
            </div>

        </div>
    </main>

    <!-- MODAL DE EDIÇÃO -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Veículo</h3>
                <button class="btn-close" onclick="closeEditModal()">×</button>
            </div>
            
            <form id="form-edit-car">
                <input type="hidden" id="edit-id">
                
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Nome do Veículo</label>
                        <input type="text" id="edit-name" required>
                    </div>

                    <div class="form-group">
                        <label>Condição</label>
                        <select id="edit-condition">
                            <option value="Novo">Novo (0 km)</option>
                            <option value="Seminovo">Seminovo</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Quilometragem</label>
                        <input type="text" id="edit-km" required>
                    </div>

                    <div class="form-group">
                        <label>Ano / Modelo</label>
                        <input type="text" id="edit-year" maxlength="9" required>
                    </div>

                    <div class="form-group">
                        <label>Preço</label>
                        <input type="text" id="edit-price" required>
                    </div>

                    <div class="form-group">
                        <label>Câmbio</label>
                        <select id="edit-gear">
                            <option value="Automático">Automático</option>
                            <option value="Manual">Manual</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Combustível</label>
                        <select id="edit-fuel">
                            <option value="Flex">Flex</option>
                            <option value="Gasolina">Gasolina</option>
                            <option value="Elétrico">Elétrico</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Opcionais</label>
                        <input type="text" id="edit-options">
                    </div>

                    <div class="form-group full-width">
                        <label>Descrição</label>
                        <textarea id="edit-desc" rows="3"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Gerenciar Fotos (Arraste para reordenar / Duplo clique para deletar)</label>
                        <div class="file-upload-box" onclick="document.getElementById('edit-images').click()">
                            <span>+ Adicionar Mais Fotos</span>
                            <input type="file" id="edit-images" multiple accept="image/*" onchange="handleFileSelect(event, 'edit')">
                        </div>
                        <div class="image-preview-container" id="edit-preview-container"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 20px;">SALVAR ALTERAÇÕES</button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS DO PAINEL ADMIN -->
    <script>
        let addCarImages = [];
        let editCarImages = [];

        // Controle do item que está em modo de exclusão (Duplo clique)
        let activeDeleteState = { mode: null, index: null };
        // Controle de origem do Drag and Drop
        let dragSrcIndex = null;

        // --- 1. MÁSCARAS DE ENTRADA --- //
        function applyCurrencyMask(e) {
            let value = e.target.value.replace(/\D/g, "");
            if(value === "") { e.target.value = ""; return; }
            value = (parseInt(value) / 100).toFixed(2);
            e.target.value = "R$ " + value.replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        }
        document.getElementById('car-price').addEventListener('input', applyCurrencyMask);
        document.getElementById('edit-price').addEventListener('input', applyCurrencyMask);

        function applyKmMask(e) {
            let value = e.target.value.replace(/\D/g, "");
            e.target.value = value ? value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.") + " km" : "";
        }
        document.getElementById('car-km').addEventListener('input', applyKmMask);
        document.getElementById('edit-km').addEventListener('input', applyKmMask);

        function applyYearMask(e) {
            let value = e.target.value.replace(/\D/g, ""); 
            if (value.length > 8) value = value.substring(0, 8);
            e.target.value = value.length > 4 ? value.substring(0, 4) + "/" + value.substring(4) : value;
        }
        document.getElementById('car-year').addEventListener('input', applyYearMask);
        document.getElementById('edit-year').addEventListener('input', applyYearMask);

        function toggleKmByCondition(conditionId, kmId) {
            const condSelect = document.getElementById(conditionId);
            const kmInput = document.getElementById(kmId);
            if (condSelect.value === 'Novo') {
                kmInput.value = '0 km';
                kmInput.disabled = true;
            } else {
                if (kmInput.value === '0 km') kmInput.value = '';
                kmInput.disabled = false;
            }
        }
        document.getElementById('car-condition').addEventListener('change', () => toggleKmByCondition('car-condition', 'car-km'));
        document.getElementById('edit-condition').addEventListener('change', () => toggleKmByCondition('edit-condition', 'edit-km'));


        // --- 2. LEITURA DE ARQUIVOS --- //
        function handleFileSelect(event, mode) {
            const files = Array.from(event.target.files);
            if (!files.length) return;

            let loadedCount = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (mode === 'add') {
                        addCarImages.push(e.target.result);
                    } else {
                        editCarImages.push(e.target.result);
                    }
                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderImagePreviews(mode);
                    }
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }


        // --- 3. REORDENAÇÃO (DRAG & DROP) E DUPLO CLIQUE PARA EXCLUIR --- //
        function renderImagePreviews(mode) {
            const isAdd = mode === 'add';
            const imagesList = isAdd ? addCarImages : editCarImages;
            const container = document.getElementById(isAdd ? 'preview-container' : 'edit-preview-container');
            container.innerHTML = '';

            imagesList.forEach((src, index) => {
                const card = document.createElement('div');
                card.className = `img-card-preview ${index === 0 ? 'is-capa' : ''}`;
                card.draggable = true;

                // Eventos de Drag & Drop (Arrastar e Soltar)
                card.ondragstart = (e) => handleDragStart(e, index);
                card.ondragover = (e) => handleDragOver(e);
                card.ondrop = (e) => handleDrop(e, index, mode);
                card.ondragend = (e) => handleDragEnd(e);

                // Evento de Duplo Clique para solicitar exclusão
                card.ondblclick = (e) => {
                    e.stopPropagation();
                    activeDeleteState = { mode, index };
                    renderImagePreviews(mode);
                };

                let cardHTML = `
                    ${index === 0 ? '<span class="capa-badge">Capa</span>' : ''}
                    <img src="${src}" alt="Foto ${index + 1}">
                `;

                // Se este card foi clicado duas vezes, mostra a overlay com o X vermelho
                if (activeDeleteState.mode === mode && activeDeleteState.index === index) {
                    cardHTML += `
                        <div class="delete-overlay">
                            <button type="button" class="btn-delete-x" onclick="confirmDeleteImage(event, ${index}, '${mode}')" title="Excluir Foto">✕</button>
                        </div>
                    `;
                }

                card.innerHTML = cardHTML;
                container.appendChild(card);
            });
        }

        // Funções de suporte para Drag and Drop
        function handleDragStart(e, index) {
            dragSrcIndex = index;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDrop(e, targetIndex, mode) {
            if (e.stopPropagation) e.stopPropagation();
            if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                const list = mode === 'add' ? addCarImages : editCarImages;
                const [movedItem] = list.splice(dragSrcIndex, 1);
                list.splice(targetIndex, 0, movedItem);
                
                // Reseta estado de exclusão ao arrastar
                cancelDeleteState();
                renderImagePreviews(mode);
            }
            return false;
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            dragSrcIndex = null;
        }

        // Confirmar Exclusão (Clicando no X Vermelho)
        function confirmDeleteImage(e, index, mode) {
            e.stopPropagation();
            const list = mode === 'add' ? addCarImages : editCarImages;
            list.splice(index, 1);
            cancelDeleteState();
            renderImagePreviews(mode);
        }

        // Cancelar Exclusão (Ao clicar fora de uma foto)
        function cancelDeleteState() {
            if (activeDeleteState.index !== null) {
                activeDeleteState = { mode: null, index: null };
                renderImagePreviews('add');
                renderImagePreviews('edit');
            }
        }

        // Listener Global: Se clicar em qualquer área fora de uma foto selecionada, o X fecha
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.img-card-preview')) {
                cancelDeleteState();
            }
        });


        // --- 4. BANCO DE DADOS E ESTOQUE (LOCALSTORAGE) --- //
        let inventory = JSON.parse(localStorage.getItem('amanhecer_inventory')) || [];

        function salvarNoBanco() {
            try {
                localStorage.setItem('amanhecer_inventory', JSON.stringify(inventory));
            } catch (e) {
                alert('Atenção: Espaço de armazenamento cheio no navegador.');
            }
        }

        function renderInventory() {
            const listContainer = document.getElementById('inventory-list');
            listContainer.innerHTML = '';
            
            if(inventory.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-gray);">Nenhum veículo cadastrado no momento.</p>';
                return;
            }

            inventory.forEach(car => {
                const item = document.createElement('div');
                item.className = 'car-list-item';
                item.innerHTML = `
                    <img src="${car.img}" alt="${car.name}">
                    <div class="car-info-list">
                        <h4>${car.name} <span style="font-size: 0.8rem; color: var(--text-gray);">(${car.year})</span></h4>
                        <p>${car.price} • ${car.fuel}</p>
                    </div>
                    <div class="car-actions">
                        <button class="btn-action btn-edit" onclick="openEditModal(${car.id})">Editar</button>
                        <button class="btn-action btn-delete" onclick="deleteCar(${car.id})">Excluir</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // Submit Cadastro
        document.getElementById('form-add-car').addEventListener('submit', function(e) {
            e.preventDefault();

            if (addCarImages.length === 0) {
                alert('Por favor, adicione pelo menos 1 foto para o veículo.');
                return;
            }

            const newCar = {
                id: Date.now(),
                name: document.getElementById('car-name').value,
                year: document.getElementById('car-year').value,
                km: document.getElementById('car-km').value,
                price: document.getElementById('car-price').value,
                condition: document.getElementById('car-condition').value,
                gear: document.getElementById('car-gear').value,
                fuel: document.getElementById('car-fuel').value,
                options: document.getElementById('car-options').value,
                desc: document.getElementById('car-desc').value,
                img: addCarImages[0], // Primeira foto da lista reordenada é a Capa
                images: [...addCarImages]
            };
            
            inventory.unshift(newCar);
            salvarNoBanco();
            
            renderInventory();
            this.reset();
            addCarImages = [];
            document.getElementById('preview-container').innerHTML = '';
            toggleKmByCondition('car-condition', 'car-km');
            alert('Veículo cadastrado com sucesso!');
        });

        // Deletar Veículo
        function deleteCar(id) {
            if(confirm('Tem certeza que deseja excluir este veículo?')) {
                inventory = inventory.filter(car => car.id !== id);
                salvarNoBanco();
                renderInventory();
            }
        }

        // Abrir Modal Edição
        const modal = document.getElementById('edit-modal');

        function openEditModal(id) {
            const car = inventory.find(c => c.id === id);
            if(car) {
                document.getElementById('edit-id').value = car.id;
                document.getElementById('edit-name').value = car.name;
                document.getElementById('edit-condition').value = car.condition;
                document.getElementById('edit-km').value = car.km;
                document.getElementById('edit-year').value = car.year;
                document.getElementById('edit-price').value = car.price;
                document.getElementById('edit-gear').value = car.gear;
                document.getElementById('edit-fuel').value = car.fuel || 'Flex';
                document.getElementById('edit-options').value = car.options || '';
                document.getElementById('edit-desc').value = car.desc || '';
                
                toggleKmByCondition('edit-condition', 'edit-km');
                
                editCarImages = (car.images && car.images.length > 0) ? [...car.images] : [car.img];
                renderImagePreviews('edit');
                
                modal.classList.add('active');
            }
        }

        function closeEditModal() {
            modal.classList.remove('active');
            editCarImages = [];
            cancelDeleteState();
            document.getElementById('form-edit-car').reset();
            document.getElementById('edit-preview-container').innerHTML = '';
        }

        // Submit Edição
        document.getElementById('form-edit-car').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('edit-id').value);
            const car = inventory.find(c => c.id === id);
            
            if(car) {
                if (editCarImages.length === 0) {
                    alert('O veículo precisa ter pelo menos 1 foto.');
                    return;
                }

                car.name = document.getElementById('edit-name').value;
                car.condition = document.getElementById('edit-condition').value;
                car.km = document.getElementById('edit-km').value;
                car.year = document.getElementById('edit-year').value;
                car.price = document.getElementById('edit-price').value;
                car.gear = document.getElementById('edit-gear').value;
                car.fuel = document.getElementById('edit-fuel').value;
                car.options = document.getElementById('edit-options').value;
                car.desc = document.getElementById('edit-desc').value;
                
                car.images = [...editCarImages];
                car.img = editCarImages[0]; // Capa atualizada

                salvarNoBanco();
                renderInventory();
                closeEditModal();
                alert('Veículo atualizado com sucesso!');
            }
        });

        // Inicialização
        toggleKmByCondition('car-condition', 'car-km');
        renderInventory();
    </script>
    
    <script src="../script.js"></script>
</body>
</html>
