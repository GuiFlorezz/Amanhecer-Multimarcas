<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | Amanhecer Multimarcas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS Geral da Loja -->
    <link rel="stylesheet" href="../style.css">

    <!-- ESTILOS EXCLUSIVOS DO PAINEL ADMIN -->
    <style>
        .admin-main {
            padding: 120px 20px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-title {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 30px;
            text-align: center;
        }

        /* Layout Grid: 1 Coluna Cadastro / 1 Coluna Estoque (Em telas grandes) */
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }
        @media (min-width: 992px) {
            .admin-grid { grid-template-columns: 1fr 1fr; }
        }

        /* Cards do Painel */
        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .admin-card h3 {
            margin-bottom: 25px;
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        /* Formulário */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        /* Upload de Imagens e Preview */
        .file-upload-box {
            border: 2px dashed var(--border);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
            transition: 0.3s;
        }
        .file-upload-box:hover { border-color: var(--gold); }
        .file-upload-box input[type="file"] { display: none; }
        
        .image-preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .img-preview {
            width: 80px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            position: relative;
        }
        .img-preview.capa {
            border-color: var(--gold);
            opacity: 1;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        /* Selo "Capa" visual */
        .img-preview.capa::after {
            content: "CAPA";
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: var(--gold);
            color: #000;
            font-size: 0.6rem;
            text-align: center;
            font-weight: bold;
        }

        /* Lista de Carros */
        .car-list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .car-list-item img {
            width: 80px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
        }
        .car-info-list {
            flex: 1;
        }
        .car-info-list h4 { font-size: 1rem; margin-bottom: 4px; }
        .car-info-list p { font-size: 0.8rem; color: var(--gold); }
        .car-actions {
            display: flex;
            gap: 8px;
        }
        .btn-action {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-edit { background: rgba(212, 175, 55, 0.2); color: var(--gold); }
        .btn-edit:hover { background: var(--gold); color: #000; }
        .btn-delete { background: rgba(255, 74, 74, 0.1); color: #ff4a4a; }
        .btn-delete:hover { background: #ff4a4a; color: #fff; }

        /* Modal de Edição (Glassmorphism) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-close {
            background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer;
        }
    </style>
</head>
<body class="bg-darker">

    <!-- Header Universal com Ilha e Menu Mobile -->
<header id="header">
    <div class="container navbar">
        <a href="../index.html" class="logo">Amanhecer<span>.</span></a>
        
        <!-- Botão Hambúrguer (Escondido no PC, Visível no Celular) -->
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <nav id="nav-menu">
            <ul class="nav-links">
                <li><a href="../index.html">Estoque</a></li>
                <li><a href="../index.html">Sobre</a></li>
                <li><a href="login.html">Painel</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main class="admin-main">
        <h1 class="admin-title">Painel Administrativo</h1>
        
        <div class="admin-grid">
            
            <!-- COLUNA 1: CADASTRAR VEÍCULO -->
            <div class="admin-card">
                <h3>Cadastrar Novo Veículo</h3>
                <form id="form-add-car">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Nome do Veículo (Marca e Modelo)</label>
                            <input type="text" id="car-name" placeholder="Ex: Porsche 911 Carrera S" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Ano</label>
                            <input type="text" id="car-year" placeholder="Ex: 2024" maxlength="4" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Quilometragem (km)</label>
                            <input type="text" id="car-km" placeholder="Ex: 15.000" required>
                        </div>

                        <div class="form-group">
                            <label>Preço</label>
                            <input type="text" id="car-price" placeholder="R$ 0,00" required>
                        </div>

                        <div class="form-group">
                            <label>Condição</label>
                            <select id="car-condition">
                                <option value="Novo">Novo (0 km)</option>
                                <option value="Seminovo">Seminovo</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>Câmbio</label>
                            <select id="car-gear">
                                <option value="Automático">Automático</option>
                                <option value="Manual">Manual</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>Opcionais (Separe por vírgula)</label>
                            <input type="text" id="car-options" placeholder="Ex: Teto Solar, Bancos em Couro, Câmera 360º">
                        </div>

                        <div class="form-group full-width">
                            <label>Descrição do Veículo</label>
                            <textarea id="car-desc" rows="4" placeholder="Detalhes sobre o estado do carro..."></textarea>
                        </div>

                        <div class="form-group full-width">
                            <label>Fotos (Selecione várias. Clique na foto abaixo para definir a Capa)</label>
                            <div class="file-upload-box" onclick="document.getElementById('car-images').click()">
                                <span>+ Clique para Selecionar Fotos</span>
                                <input type="file" id="car-images" multiple accept="image/*" onchange="previewImages(this, 'preview-container')">
                            </div>
                            <div class="image-preview-container" id="preview-container">
                                <!-- Miniaturas aparecerão aqui -->
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 20px;">CADASTRAR VEÍCULO</button>
                </form>
            </div>

            <!-- COLUNA 2: ESTOQUE ATUAL -->
            <div class="admin-card">
                <h3>Veículos no Site</h3>
                <div id="inventory-list">
                    <!-- Itens inseridos via JavaScript -->
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL DE EDIÇÃO -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Veículo</h3>
                <button class="btn-close" onclick="closeEditModal()">×</button>
            </div>
            
            <form id="form-edit-car">
                <input type="hidden" id="edit-id">
                
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Nome do Veículo (Marca e Modelo)</label>
                        <input type="text" id="edit-name" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Ano</label>
                        <input type="text" id="edit-year" maxlength="4" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Quilometragem (km)</label>
                        <input type="text" id="edit-km" required>
                    </div>

                    <div class="form-group">
                        <label>Preço</label>
                        <input type="text" id="edit-price" required>
                    </div>

                    <div class="form-group">
                        <label>Condição</label>
                        <select id="edit-condition">
                            <option value="Novo">Novo (0 km)</option>
                            <option value="Seminovo">Seminovo</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Câmbio</label>
                        <select id="edit-gear">
                            <option value="Automático">Automático</option>
                            <option value="Manual">Manual</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Opcionais (Separe por vírgula)</label>
                        <input type="text" id="edit-options">
                    </div>

                    <div class="form-group full-width">
                        <label>Descrição do Veículo</label>
                        <textarea id="edit-desc" rows="3"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Alterar Fotos (Nova seleção substitui as antigas)</label>
                        <div class="file-upload-box" onclick="document.getElementById('edit-images').click()">
                            <span>+ Clique para Selecionar Novas Fotos</span>
                            <input type="file" id="edit-images" multiple accept="image/*" onchange="previewImages(this, 'edit-preview-container')">
                        </div>
                        <div class="image-preview-container" id="edit-preview-container">
                            <!-- Miniaturas da edição aparecerão aqui -->
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 20px;">SALVAR ALTERAÇÕES</button>
            </form>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer" style="padding: 20px 0; border-top: 1px solid var(--border); background: #0a0a0a;">
        <div class="footer-bottom container" style="display: flex; justify-content: center; gap: 20px;">
            <p>&copy; 2026 Amanhecer Multimarcas.</p>
            <p class="dev-credits">Desenvolvido por <a style="color: var(--gold); font-weight: 600; text-decoration: none;" href="https://nivotech.com.br" target="_blank">NivoTech</a></p>
        </div>
    </footer>

    <!-- SCRIPTS DO PAINEL ADMIN -->
    <script>
       // --- 1. MÁSCARAS DE INPUTS (Formatação Automática) --- //
        
        // Máscara de Moeda (Preço)
        function applyCurrencyMask(e) {
            let value = e.target.value.replace(/\D/g, "");
            if(value === "") { e.target.value = ""; return; }
            value = (parseInt(value) / 100).toFixed(2);
            e.target.value = "R$ " + value.replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        }
        document.getElementById('car-price').addEventListener('input', applyCurrencyMask);
        document.getElementById('edit-price').addEventListener('input', applyCurrencyMask);

        // Máscara de Quilometragem
        function applyKmMask(e) {
            let value = e.target.value.replace(/\D/g, "");
            if(value) {
                e.target.value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            }
        }
        document.getElementById('car-km').addEventListener('input', applyKmMask);
        document.getElementById('edit-km').addEventListener('input', applyKmMask);

        // Máscara Ano (Apenas números)
        function applyYearMask(e) {
            e.target.value = e.target.value.replace(/\D/g, "");
        }
        document.getElementById('car-year').addEventListener('input', applyYearMask);
        document.getElementById('edit-year').addEventListener('input', applyYearMask);

        // --- 2. UPLOAD DE FOTOS E CAPA --- //
        function previewImages(input, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = ""; // Limpa previews antigos
            
            if(input.files) {
                Array.from(input.files).forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.classList.add('img-preview');
                        if(index === 0) img.classList.add('capa'); // Primeira foto é capa
                        
                        img.onclick = function() {
                            document.querySelectorAll('#' + containerId + ' .img-preview').forEach(i => i.classList.remove('capa'));
                            this.classList.add('capa');
                        };
                        container.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        // --- 3. SIMULAÇÃO DO BANCO DE DADOS --- //
        // Adicionamos os outros campos na simulação para teste
        let inventory = [
            { id: 1, name: 'Porsche 911 Carrera S', year: '2024', km: '0', price: 'R$ 980.000,00', condition: 'Novo', gear: 'Automático', options: 'Teto Solar, Sport Chrono', desc: 'Veículo em estado impecável.', img: 'https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?w=150' },
            { id: 2, name: 'BMW M4 Competition', year: '2023', km: '12.500', price: 'R$ 650.000,00', condition: 'Seminovo', gear: 'Automático', options: 'Bancos Concha, Harman Kardon', desc: 'Revisões na concessionária.', img: 'https://images.unsplash.com/photo-1617531653332-bd46c24f2068?w=150' }
        ];

        const listContainer = document.getElementById('inventory-list');

        function renderInventory() {
            listContainer.innerHTML = '';
            if(inventory.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-gray);">Nenhum veículo cadastrado.</p>';
                return;
            }

            inventory.forEach(car => {
                const item = document.createElement('div');
                item.className = 'car-list-item';
                item.innerHTML = `
                    <img src="${car.img}" alt="${car.name}">
                    <div class="car-info-list">
                        <h4>${car.name} <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-gray);">(${car.year})</span></h4>
                        <p>${car.price}</p>
                    </div>
                    <div class="car-actions">
                        <button class="btn-action btn-edit" onclick="openEditModal(${car.id})">Editar</button>
                        <button class="btn-action btn-delete" onclick="deleteCar(${car.id})">Excluir</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // Cadastro de Novo Carro
        document.getElementById('form-add-car').addEventListener('submit', function(e) {
            e.preventDefault();
            const newCar = {
                id: Date.now(),
                name: document.getElementById('car-name').value,
                year: document.getElementById('car-year').value,
                km: document.getElementById('car-km').value,
                price: document.getElementById('car-price').value,
                condition: document.getElementById('car-condition').value,
                gear: document.getElementById('car-gear').value,
                options: document.getElementById('car-options').value,
                desc: document.getElementById('car-desc').value,
                img: document.querySelector('#preview-container .capa')?.src || 'https://images.unsplash.com/photo-1503376713210-9150ee8c4d32?w=150'
            };
            inventory.push(newCar);
            renderInventory();
            this.reset();
            document.getElementById('preview-container').innerHTML = '';
            alert('Veículo cadastrado com sucesso!');
        });

        // Deletar
        function deleteCar(id) {
            if(confirm('Tem certeza que deseja excluir este veículo?')) {
                inventory = inventory.filter(car => car.id !== id);
                renderInventory();
            }
        }

        // --- 4. LÓGICA DO MODAL DE EDIÇÃO --- //
        const modal = document.getElementById('edit-modal');
        
        function openEditModal(id) {
            const car = inventory.find(c => c.id === id);
            if(car) {
                document.getElementById('edit-id').value = car.id;
                document.getElementById('edit-name').value = car.name;
                document.getElementById('edit-year').value = car.year;
                document.getElementById('edit-km').value = car.km;
                document.getElementById('edit-price').value = car.price;
                document.getElementById('edit-condition').value = car.condition;
                document.getElementById('edit-gear').value = car.gear;
                document.getElementById('edit-options').value = car.options;
                document.getElementById('edit-desc').value = car.desc;
                
                // Mostra a foto atual no preview da edição
                document.getElementById('edit-preview-container').innerHTML = `
                    <img src="${car.img}" class="img-preview capa">
                `;
                
                modal.classList.add('active');
            }
        }
        
        function closeEditModal() {
            modal.classList.remove('active');
            document.getElementById('form-edit-car').reset();
            document.getElementById('edit-preview-container').innerHTML = '';
        }

        // Salvar Edição
        document.getElementById('form-edit-car').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('edit-id').value);
            const car = inventory.find(c => c.id === id);
            
            if(car) {
                car.name = document.getElementById('edit-name').value;
                car.year = document.getElementById('edit-year').value;
                car.km = document.getElementById('edit-km').value;
                car.price = document.getElementById('edit-price').value;
                car.condition = document.getElementById('edit-condition').value;
                car.gear = document.getElementById('edit-gear').value;
                car.options = document.getElementById('edit-options').value;
                car.desc = document.getElementById('edit-desc').value;
                
                // Se adicionou uma nova foto na edição, substitui. Caso contrário, mantém a antiga.
                const newImg = document.querySelector('#edit-preview-container .capa')?.src;
                if(newImg) {
                    car.img = newImg;
                }

                renderInventory();
                closeEditModal();
                alert('Alterações salvas com sucesso!');
            }
        });

        // Inicializa a lista de estoque
        renderInventory();
    </script>
    
    <!-- Script Principal (Mantém o efeito da Ilha no Header) -->
    <script src="../script.js"></script>
</body>
</html>
